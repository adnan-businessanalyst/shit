kind = "web"
previewPath = "/"
title = "Ofoq Al Diafah"
version = "1.0.0"
id = "artifacts/ofoq-al-diafah"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "pnpm --filter @workspace/ofoq-al-diafah run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ofoq-al-diafah", "run", "build" ]
publicDir = "artifacts/ofoq-al-diafah/dist"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/"
